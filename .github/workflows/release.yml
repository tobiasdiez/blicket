name: Release

on:
  push:
    branches: [main]

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  release-pr:
    name: Release PR
    if: github.repository_owner == 'tobiasdiez'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create Release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A personal access token: CI does not run on PRs opened with GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PR_TOKEN }}

  publish:
    name: Publish to PyPI
    needs: release-pr
    if: needs.release-pr.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/blicket
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: viewer/package.json

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      
      - name: Install dependencies
        run: uv sync --only-group build

      - name: Build
        run: |
          uv build --sdist
          uv build --wheel -Csetup-args=-Dviewer=enabled
      
      - name: Smoketest
        run: |
          uv venv "$RUNNER_TEMP/release"
          uv pip install --python "$RUNNER_TEMP/release" dist/*.whl
          env -u BLICKET_VIEWER "$RUNNER_TEMP/release/bin/python" -c "from blicket import viewer; viewer.find()"
      
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
