[project]
name = "remind-blicks"
version = "0"
description = "Blicks on REMIND runs, the Summary chapter of compareScenarios, an example blicket project."
requires-python = ">=3.14"
dependencies = ["blicket", "pyyaml"]

[tool.uv.sources]
# Not editable: uv rebuilds blicket when a file named in its [tool.uv] cache-keys changes.
blicket = { path = "../.." }

[tool.blicket]
# The loader is load_run in blicketconf.py next to this file, the Blicks are under blicks/. runs
# are the folders blicket dev offers to pick when started without one, where the README puts them.
runs = ["../../data_out/remind/*"]
