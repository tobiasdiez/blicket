[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.18"]

[project]
name = "blicket"
# Static on purpose: a dynamic version breaks a fresh `uv sync` without build isolation.
version = "0.1.0.dev0"
description = "Storybook for scientific model outputs: named views on model runs."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Diez", email = "code@tobiasdiez.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["polars>=2.0", "pydantic>=2.13", "typer>=0.27"]

[project.scripts]
blicket = "blicket.cli:app"

[dependency-groups]
# Needed in the environment because blicket is built without isolation (see [tool.uv]), so that
# the editable install can rebuild on import.
build = ["meson-python>=0.18", "meson>=1.5", "ninja>=1.11"]
# numpy, pandas, pyarrow and xarray only for the tests of the table conversion; blicket never
# imports them.
dev = [
    { include-group = "build" },
    "jsonschema>=4.26",
    "numpy>=2.5",
    "pandas>=3.1",
    "pyarrow>=26",
    "pytest>=9.1",
    "ruff>=0.17",
    "ty>=0.0.91",
    "xarray>=2026.9",
]

[tool.uv]
no-build-isolation-package = ["blicket"]
default-groups = ["build", "dev"]
# What uv watches to rebuild blicket where it is a path dependency, as in examples/remind-mfa.
cache-keys = [{ file = "pyproject.toml" }, { file = "meson.build" }, { file = "src/**/*.py" }]

[tool.ruff]
line-length = 100
# ruff also formats Python blocks in Markdown; the design documents keep their own layout.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4"]

[tool.ty.src]
# meson's build directory
exclude = ["build"]

[[tool.ty.overrides]]
# The examples import their models, which blicket's environment lacks; their blicket calls are
# still checked.
include = ["examples/**"]
rules.unresolved-import = "ignore"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
